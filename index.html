<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glasperlen Shoe Viewer</title>
    
    <!-- 1. LINK TO YOUR NEW EXTERNAL CSS FILE -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- 2. IMPORT GOOGLE MODEL VIEWER COMPONENT -->
    <script type="module" src="https://googleapis.com"></script>
</head>
<body>

    <!-- Clean, semantic HTML configuration -->
    <model-viewer 
        alt="GlasperlenShoe" 
        src="assets/GlasperlenShoe.glb" 
        poster="assets/poster.webp"
        ar 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1"
        interaction-prompt="none">
    </model-viewer>

</body>
</html>
