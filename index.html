<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glasperlen Shoe Viewer</title>
    
    <!-- 1. LINK TO YOUR NEW EXTERNAL CSS FILE -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- 2. IMPORT GOOGLE MODEL VIEWER COMPONENT -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</head>
<body>

    <model-viewer 
        id="shoeViewer"
        alt="Glasperlen Shoe" 
        src="assets/GlasperlenShoe.glb" 
        poster="assets/poster.webp"
        ar 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1"
        interaction-prompt="none"
        interpolation-decay="200">
    </model-viewer>

    <!-- 1. JAVASCRIPT FORCE OVERRIDE TO PIERCE THE SHADOW DOM -->
    <script>
    const viewer = document.getElementById('shoeViewer');

    viewer.addEventListener('load', () => {
        const shadowRoot = viewer.shadowRoot;
        if (shadowRoot) {
            const internalElements = shadowRoot.querySelectorAll('*');

            // Set cursor to 'none' to make the arrow completely invisible
            internalElements.forEach(el => {
                el.style.setProperty('cursor', 'none', 'important');
            });

            // Prevent Google from showing the arrow again when clicked
            viewer.addEventListener('mousedown', () => {
                internalElements.forEach(el => el.style.setProperty('cursor', 'none', 'important'));
            });
            viewer.addEventListener('mouseup', () => {
                internalElements.forEach(el => el.style.setProperty('cursor', 'none', 'important'));
            });
        }
    });
</script>

</body>
</html>
